name: "Tailscale (Auto-Updating)"
description: "Zero-config VPN for Home Assistant with automated daily upstream updates"
version: "1.92.3"
slug: "tailscale_auto"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
host_network: true
full_access: true
devices:
  - "/dev/net/tun:/dev/net/tun:rwm"
options:
  accept_dns: true
  accept_routes: false
  advertise_routes: ""
  snat_subnets: true
  login_server: ""
  extra_args: ""
schema:
  accept_dns: bool
  accept_routes: bool
  advertise_routes: str?
  snat_subnets: bool?
  login_server: str?
  extra_args: str?
